<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault 2K26 - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #001a4d 0%, #003d99 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .page-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-button {
            align-self: flex-start;
            background: linear-gradient(135deg, #00a8ff 0%, #0080cc 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 40px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 168, 255, 0.4);
        }

        .login-container {
            background: #0d1f3c;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #1a3a7a;
        }

        .vault-title {
            text-align: center;
            color: #00a8ff;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .vault-subtitle {
            text-align: center;
            color: #6ba3d4;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            color: #a0c4ff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #1a3a7a;
            background: #051020;
            color: #ffffff;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #00a8ff;
            background: #0a1a2e;
            box-shadow: 0 0 10px rgba(0, 168, 255, 0.2);
        }

        .form-input::placeholder {
            color: #4a6fa5;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00a8ff 0%, #0080cc 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 168, 255, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .create-account-link {
            text-align: center;
        }

        .create-account-text {
            color: #6ba3d4;
            font-size: 14px;
        }

        .create-account-text button {
            background: none;
            border: none;
            color: #00a8ff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
            font-size: 14px;
            padding: 0;
        }

        .create-account-text button:hover {
            color: #00d9ff;
            text-decoration: underline;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #0d1f3c;
            border: 2px solid #1a3a7a;
            border-radius: 12px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            color: #00ff00;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .modal-text {
            color: #a0c4ff;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .modal-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00a8ff 0%, #0080cc 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 168, 255, 0.4);
        }

        .modal-close {
            width: 100%;
            padding: 12px;
            background: #1a3a7a;
            color: #a0c4ff;
            border: 1px solid #2a5aaa;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-close:hover {
            background: #2a5aaa;
            color: #00a8ff;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 36px 24px;
            }

            .vault-title {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                width: 85%;
            }

            .modal-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <button class="back-button" onclick="goBack()">← BACK</button>

        <!-- Login Form -->
        <div class="login-container">
            <h1 class="vault-title">Vault 2K26</h1>
            <p class="vault-subtitle">Secure Login</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">Login</button>
            </form>

            <div class="create-account-link">
                <p class="create-account-text">
                    Don't have an account? <button type="button" id="quickCreate">CREATE ACCOUNT</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Create Account Modal -->
    <div id="createAccountModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">Create Account</h2>
            <p class="modal-text">
                You need to create an account to continue. Click the button below to proceed.
            </p>
            <button class="modal-button" id="modalCreateBtn">Create Account Now</button>
            <button class="modal-close" id="modalCloseBtn">Cancel</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('createAccountModal');
        const loginForm = document.getElementById('loginForm');
        const quickCreateBtn = document.getElementById('quickCreate');
        const modalCreateBtn = document.getElementById('modalCreateBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        const telegramURL = 'https://t.me/vault2k26';

        function goBack() {
            window.history.back();
        }

        // Quick create button - redirect without popup
        quickCreateBtn.addEventListener('click', function(e) {
            e.preventDefault();
            redirectToTelegram();
        });

        // Show modal on login attempt
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                // Show the create account modal
                modal.classList.add('show');
            }
        });

        // Modal create account button redirects
        modalCreateBtn.addEventListener('click', function() {
            redirectToTelegram();
        });

        // Close modal on cancel
        modalCloseBtn.addEventListener('click', function() {
            modal.classList.remove('show');
        });

        // Close modal when clicking outside of it
        window.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        });

        // Function to redirect to Telegram
        function redirectToTelegram() {
            window.open(telegramURL, '_blank');
        }
    </script>
</body>
</html>
