<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault 2K26 - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #001a4d 0%, #003d99 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .vault-logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .vault-title {
            color: #00ff00;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .vault-tagline {
            color: #6ba3d4;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .menu-card {
            background: linear-gradient(135deg, #0d1f3c 0%, #1a2f4a 100%);
            border: 2px solid #1a3a7a;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00a8ff, #00ff00, #0080cc);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .menu-card:hover {
            border-color: #00a8ff;
            box-shadow: 0 0 30px rgba(0, 168, 255, 0.4);
            transform: translateY(-5px);
        }

        .menu-card:hover::before {
            opacity: 1;
        }

        .menu-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .menu-title {
            color: #00a8ff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .menu-card:hover .menu-title {
            color: #00ff00;
        }

        .menu-description {
            color: #6ba3d4;
            font-size: 13px;
            margin-top: 10px;
            transition: color 0.3s ease;
        }

        .menu-card:hover .menu-description {
            color: #a0c4ff;
        }

        /* Animation */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-card {
            animation: slideInUp 0.5s ease backwards;
        }

        .menu-card:nth-child(1) { animation-delay: 0.1s; }
        .menu-card:nth-child(2) { animation-delay: 0.2s; }
        .menu-card:nth-child(3) { animation-delay: 0.3s; }
        .menu-card:nth-child(4) { animation-delay: 0.4s; }
        .menu-card:nth-child(5) { animation-delay: 0.5s; }

        .footer {
            text-align: center;
            color: #6ba3d4;
            font-size: 13px;
            margin-top: 40px;
        }

        @media (max-width: 1024px) {
            .menu-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .vault-title {
                font-size: 36px;
            }

            .vault-tagline {
                font-size: 16px;
            }

            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .menu-card {
                padding: 30px 20px;
            }

            .menu-icon {
                font-size: 36px;
            }

            .menu-title {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .vault-title {
                font-size: 28px;
                letter-spacing: 2px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .menu-card {
                padding: 25px 15px;
            }

            .menu-icon {
                font-size: 32px;
            }

            .menu-title {
                font-size: 16px;
            }

            .menu-description {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="vault-logo">🔐</div>
            <h1 class="vault-title">VAULT 2K26</h1>
            <p class="vault-tagline">Your Ultimate Access Portal</p>
        </div>

        <!-- Menu Grid -->
        <div class="menu-grid">
            <!-- Login Card -->
            <div class="menu-card" onclick="goToLogin()">
                <span class="menu-icon">🔑</span>
                <h2 class="menu-title">LOGIN</h2>
                <p class="menu-description">Access your account</p>
            </div>

            <!-- No Account Card -->
            <div class="menu-card" onclick="goToCreateAccount()">
                <span class="menu-icon">➕</span>
                <h2 class="menu-title">NO ACCOUNT?</h2>
                <p class="menu-description">Get access now</p>
            </div>

            <!-- Pricelist Card -->
            <div class="menu-card" onclick="goToPricelist()">
                <span class="menu-icon">💰</span>
                <h2 class="menu-title">PRICELIST</h2>
                <p class="menu-description">View our plans</p>
            </div>

            <!-- Samples Card -->
            <div class="menu-card" onclick="goToSamples()">
                <span class="menu-icon">📦</span>
                <h2 class="menu-title">SAMPLES</h2>
                <p class="menu-description">Check our samples</p>
            </div>

            <!-- Proofs Card -->
            <div class="menu-card" onclick="goToProofs()">
                <span class="menu-icon">✅</span>
                <h2 class="menu-title">PROOFS</h2>
                <p class="menu-description">See the evidence</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2024 Vault 2K26 | Secure Access Platform</p>
        </div>
    </div>

    <script>
        // Navigation functions
        function goToLogin() {
            window.location.href = 'login.html';
        }

        function goToCreateAccount() {
            window.open('https://t.me/vault2k26', '_blank');
        }

        function goToPricelist() {
            window.location.href = 'pricelist.html';
        }

        function goToSamples() {
            window.open('https://t.me/samplesvault', '_blank');
        }

        function goToProofs() {
            window.open('https://t.me/vault2k26proofs', '_blank');
        }
    </script>
</body>
</html>
