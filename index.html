<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <title>Vault 2K26 - Welcome</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <div class="header" id="homeLogo" onclick="showPage('home')">
            <div class="vault-logo">🔐</div>
            <h1 class="vault-title">VAULT 2K26</h1>
            <p class="vault-tagline">Access Portal</p>
        </div>

        <!-- CONTENT AREA -->
        <div class="content-wrapper">
            
            <!-- HOME PAGE -->
            <div id="homePage" class="page active">
                <div class="home-content">
                    <div class="menu-grid">
                        <button class="menu-card" onclick="showPage('login')">
                            <span class="menu-icon">🔑</span>
                            <h2 class="menu-title">LOGIN</h2>
                        </button>

                        <button class="menu-card" id="noAccountBtn">
                            <span class="menu-icon">➕</span>
                            <h2 class="menu-title">NO ACCOUNT?</h2>
                        </button>

                        <button class="menu-card" onclick="showPage('pricing')">
                            <span class="menu-icon">💰</span>
                            <h2 class="menu-title">PRICING</h2>
                        </button>

                        <button class="menu-card" id="samplesBtn">
                            <span class="menu-icon">📦</span>
                            <h2 class="menu-title">SAMPLES</h2>
                        </button>

                        <button class="menu-card" id="proofsBtn">
                            <span class="menu-icon">✅</span>
                            <h2 class="menu-title">PROOFS</h2>
                        </button>

                        <button class="menu-card" onclick="showPage('channels')">
                            <span class="menu-icon">📺</span>
                            <h2 class="menu-title">CHANNELS</h2>
                        </button>
                    </div>
                    
                    <div class="home-footer">
                        © 2024 Vault 2K26
                    </div>
                </div>
            </div>

            <!-- CHANNELS PAGE -->
            <div id="channelsPage" class="page">
                <div class="page-header">
                    <button class="back-button" onclick="showPage('home')">
                        <span class="back-arrow">←</span> Back
                    </button>
                    <h2 class="page-title">Channel List</h2>
                    <p class="page-subtitle">Explore exclusive channels</p>
                </div>
                <div class="channels-wrapper">
                    <div class="channels-grid" id="channelsGrid">
                        <!-- Channels generated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- LOGIN PAGE -->
            <div id="loginPage" class="page">
                <div class="login-container">
                    <button class="back-button back-button-floating" onclick="showPage('home')">
                        <span class="back-arrow">←</span> Back
                    </button>
                    <h1 class="login-title">LOGIN</h1>
                    <p class="login-subtitle">Secure Access</p>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" class="form-input" placeholder="Enter username" required>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-input" placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="login-button">Login</button>
                    </form>

                    <div class="create-account-link">
                        <p class="create-account-text">
                            No account? <button type="button" id="quickCreate">CREATE NOW</button>
                        </p>
                    </div>
                </div>
            </div>

            <!-- PRICING PAGE -->
            <div id="pricingPage" class="page">
                <div class="pricing-container">
                    <button class="back-button back-button-floating" onclick="showPage('home')">
                        <span class="back-arrow">←</span> Back
                    </button>
                    <h2 class="pricing-title">PRICING</h2>
                    <p class="pricing-subtitle">Complete Access</p>

                    <div class="price-display">
                        <div class="price-amount" id="priceAmount">₱500</div>
                        <div class="price-type" id="priceType">One Time</div>
                    </div>

                    <div class="features-list" id="featuresList">
                        <!-- Features generated by JavaScript -->
                    </div>

                    <button class="buy-button" id="buyButton">GET ACCESS NOW</button>
                </div>
            </div>

        </div>
    </div>

    <!-- MODALS -->
    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">Create Account</h2>
            <p class="modal-text">Create an account to access all features.</p>
            <button class="modal-button" id="modalCreateBtn">CREATE ACCOUNT</button>
            <button class="modal-close" id="loginModalCloseBtn">Cancel</button>
        </div>
    </div>

    <!-- Channel Access Modal -->
    <div id="channelAccessModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">Get Account</h2>
            <p class="modal-text">Create an account to access this channel.</p>
            <button class="modal-button" id="modalAvailBtn">AVAIL HERE</button>
            <button class="modal-close" id="channelModalCloseBtn">Cancel</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
